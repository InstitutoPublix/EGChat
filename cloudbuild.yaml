# Cloud Build Configuration
# Triggers Docker build, pushes to Artifact Registry, deploys to Cloud Run
# Usage: gcloud builds submit --project=PROJECT_ID --config=cloudbuild.yaml

substitutions:
  _REGION: southamerica-east1
  _SERVICE_NAME: mentor-virtual-tjce
  _REPOSITORY: cloud-run-source-deploy
  _QDRANT_URL: https://847e925b-b8a7-400e-92c4-c15fba8de03f.sa-east-1-0.aws.cloud.qdrant.io
  _QDRANT_COLLECTION: egchat_tjce
  _CLAUDE_MODEL: claude-haiku-4-5-20251001
  _KEEP_IMAGES: "2"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: N1_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

steps:
  - id: ensure-artifact-registry
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud artifacts repositories describe "${_REPOSITORY}" \
          --project="$PROJECT_ID" \
          --location="${_REGION}" >/dev/null 2>&1 || \
        gcloud artifacts repositories create "${_REPOSITORY}" \
          --project="$PROJECT_ID" \
          --location="${_REGION}" \
          --repository-format=docker \
          --description="Imagens Docker do Cloud Run"

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  - id: push-build-id
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --memory
      - 2Gi
      - --cpu
      - "1"
      - --cpu-throttling
      - --timeout
      - "300"
      - --concurrency
      - "4"
      - --service-account
      - mentor-virtual-tjce-run-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars
      - QDRANT_URL=${_QDRANT_URL},QDRANT_COLLECTION=${_QDRANT_COLLECTION},CLAUDE_MODEL=${_CLAUDE_MODEL},PYTHONUNBUFFERED=1
      - --set-secrets
      - OPENAI_API_KEY=openai-api-key:latest,CLAUDE_API_KEY=claude-api-key:latest,QDRANT_API_KEY=qdrant-api-key:latest

  - id: cleanup-old-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE_PATH="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}"
        KEEP="${_KEEP_IMAGES}"

        gcloud artifacts docker images list "$$IMAGE_PATH" \
          --include-tags \
          --sort-by="~UPDATE_TIME" \
          --format="value(DIGEST)" | \
        tail -n +"$$(($$KEEP + 1))" | \
        while read -r digest; do
          if [ -n "$$digest" ]; then
            gcloud artifacts docker images delete "$$IMAGE_PATH@$$digest" \
              --quiet \
              --delete-tags || true
          fi
        done

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

timeout: 1800s
